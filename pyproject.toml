[project]
name = "chemistry-agent"
version = "0.1.0"
description = "Simpe GCSE level chemistry agent which can solve simple chemitry problems"
authors = [
    {name = "Stacy Shcherbakova",email = "stacyshcherbakova@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fhaviary (>=0.22.1,<0.23.0)",
    "ldp @ git+https://github.com/Future-House/ldp.git",
    "pydantic (>=2.11.7,<3.0.0)",
    "periodictable (>=2.0.2,<3.0.0)",
    "pint (>=0.24.4,<0.25.0)",
    "ipykernel (>=6.30.0,<7.0.0)",
    "pytest (>=8.4.1,<9.0.0)",
    "pytest-asyncio (>=1.1.0,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
